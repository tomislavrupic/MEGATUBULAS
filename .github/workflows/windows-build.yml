name: Windows numerical crash diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned JUCE
        shell: pwsh
        run: |
          git clone --depth 1 --branch 8.0.14 https://github.com/juce-framework/JUCE.git third_party/JUCE
          if ($LASTEXITCODE -ne 0) { throw 'JUCE clone failed' }
          if ((git -C third_party/JUCE rev-parse HEAD).Trim() -ne '2cdfca8feb300fb424002ba2c2751569e5bacb64') { throw 'JUCE pin mismatch' }
      - name: Build numerical executable with assembly diagnostics
        shell: pwsh
        run: |
          cmake -S . -B build-diag -A x64 '-DCMAKE_CXX_FLAGS_RELEASE=/O2 /DNDEBUG /FAs'
          if ($LASTEXITCODE -ne 0) { throw 'Configure failed' }
          cmake --build build-diag --config Release --parallel 4 --target MicroTests
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Capture direct Windows exception code
        shell: pwsh
        run: |
          & build-diag/MicroTests_artefacts/Release/MicroTests.exe | Tee-Object numerical-direct.log
          $code = $LASTEXITCODE
          "Exit code: $code / hex $([Convert]::ToString($code,16))" | Tee-Object -Append numerical-direct.log
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-numerical-diagnostic
          path: |
            numerical-direct.log
            build-diag/**/Tests.asm
            build-diag/**/MicroTests.exe
          retention-days: 7
